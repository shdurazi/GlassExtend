name: Build GlassExtend
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ls -1
          unzip -oq GlassExtend-phone.zip || { echo "::error::GlassExtend-phone.zip is not in the repo root"; exit 1; }
          cd GlassExtend-phone
          bash arrange.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleRelease --no-daemon
        working-directory: GlassExtend-phone
      - uses: actions/upload-artifact@v4
        with:
          name: GlassExtend-apk
          path: GlassExtend-phone/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
